<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patungan</title>
  <meta name="description" content="Bagi tagihan makan bareng, termasuk service dan pajak, dalam 15 detik.">
  <meta name="theme-color" content="#1d6b4c">
  <meta property="og:title" content="Patungan">
  <meta property="og:description" content="Bagi tagihan makan bareng, termasuk service dan pajak, dalam 15 detik.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d6b4c'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='white'%3ERp%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Patungan</h1>
      <p>Bagi tagihan makan bareng, termasuk service dan pajak.</p>
    </header>

    <form id="form" class="form" autocomplete="off">
      <label class="field" for="total">
        <span class="label">Total tagihan</span>
        <span class="money">
          <span class="rp">Rp</span>
          <input id="total" name="total" type="text" inputmode="numeric" placeholder="0" enterkeyhint="done">
        </span>
      </label>

      <div class="field">
        <span class="label" id="orang-label">Jumlah orang</span>
        <div class="stepper" role="group" aria-labelledby="orang-label">
          <button type="button" id="kurang" aria-label="Kurangi satu orang">−</button>
          <output id="orang" aria-live="polite">2</output>
          <button type="button" id="tambah" aria-label="Tambah satu orang">+</button>
        </div>
      </div>

      <fieldset class="field">
        <legend class="label">Service</legend>
        <div class="seg">
          <input type="radio" name="service" id="service-0" value="0" checked><label for="service-0">0%</label>
          <input type="radio" name="service" id="service-5" value="5"><label for="service-5">5%</label>
          <input type="radio" name="service" id="service-10" value="10"><label for="service-10">10%</label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend class="label">Pajak</legend>
        <div class="seg">
          <input type="radio" name="pajak" id="pajak-0" value="0" checked><label for="pajak-0">0%</label>
          <input type="radio" name="pajak" id="pajak-10" value="10"><label for="pajak-10">10%</label>
        </div>
      </fieldset>

      <label class="field" for="tip">
        <span class="label">Tip <em>(opsional)</em></span>
        <span class="money small">
          <span class="rp">Rp</span>
          <input id="tip" name="tip" type="text" inputmode="numeric" placeholder="0" enterkeyhint="done">
        </span>
      </label>
    </form>

    <section class="rincian" aria-labelledby="rincian-judul">
      <h2 id="rincian-judul" class="label">Rincian</h2>
      <dl>
        <div class="baris"><dt>Subtotal</dt><dd id="r-subtotal">0</dd></div>
        <div class="baris"><dt id="r-service-label">Service 0%</dt><dd id="r-service">0</dd></div>
        <div class="baris"><dt id="r-pajak-label">Pajak 0%</dt><dd id="r-pajak">0</dd></div>
        <div class="baris"><dt>Tip</dt><dd id="r-tip">0</dd></div>
        <div class="baris total"><dt>Total</dt><dd id="r-total">0</dd></div>
      </dl>
    </section>

    <section class="hasil" aria-live="polite">
      <span class="hasil-label">Per orang</span>
      <span class="hasil-angka" id="per-orang">Rp 0</span>
      <span class="hasil-catatan" id="selisih">Isi total tagihan untuk mulai</span>
      <button type="button" id="salin" class="salin" disabled>Salin ke WhatsApp</button>
      <textarea id="salin-cadangan" class="salin-cadangan" readonly hidden aria-label="Teks untuk disalin"></textarea>
    </section>
  </main>

  <script src="hitung.js"></script>
  <script src="script.js"></script>
</body>
</html>
